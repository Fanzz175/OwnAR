
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Robot Viewer</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="1"></a-light>

    <a-marker preset="hiro">

      <!-- Robot Head -->
      <a-box
        position="0 1.3 0"
        width="0.8"
        height="0.7"
        depth="0.6"
        color="#3498DB"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
      </a-box>

      <!-- Left Eye -->
      <a-sphere
        position="-0.2 1.4 0.31"
        radius="0.08"
        color="white">
      </a-sphere>

      <!-- Right Eye -->
      <a-sphere
        position="0.2 1.4 0.31"
        radius="0.08"
        color="white">
      </a-sphere>

      <!-- Robot Mouth -->
      <a-box
        position="0 1.18 0.32"
        width="0.3"
        height="0.06"
        depth="0.03"
        color="#222222">
      </a-box>

      <!-- Robot Body -->
      <a-box
        position="0 0.65 0"
        width="0.65"
        height="0.6"
        depth="0.4"
        color="#E74C3C">
      </a-box>

      <!-- Left Arm -->
      <a-box
        position="-0.48 0.7 0"
        width="0.18"
        height="0.55"
        depth="0.2"
        color="#F1C40F"
        rotation="0 0 15">
      </a-box>

      <!-- Right Arm -->
      <a-box
        position="0.48 0.7 0"
        width="0.18"
        height="0.55"
        depth="0.2"
        color="#F1C40F"
        rotation="0 0 -15">
      </a-box>

      <!-- Left Leg -->
      <a-box
        position="-0.2 0.15 0"
        width="0.2"
        height="0.35"
        depth="0.25"
        color="#34495E">
      </a-box>

      <!-- Right Leg -->
      <a-box
        position="0.2 0.15 0"
        width="0.2"
        height="0.35"
        depth="0.25"
        color="#34495E">
      </a-box>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
